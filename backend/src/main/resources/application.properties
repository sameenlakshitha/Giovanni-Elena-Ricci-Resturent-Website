spring.application.name=restaurant-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/giovanni_ricci?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT secret must be supplied through an environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:change-this-development-secret}
app.jwt.expiration-ms=86400000

# Comma-separated frontend origins for local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}